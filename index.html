<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --text:#151923;
  --muted:#727989;
  --border:#e5e8ef;
  --dark:#151923;
  --accent:#635bff;
  --green:#18a957;
  --red:#e63962;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

header{
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--border);
  padding:15px 18px;
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(12px);
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  text-decoration:none;
  color:var(--text);
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:var(--accent);
}

.header-button{
  border:none;
  background:var(--dark);
  color:white;
  padding:10px 15px;
  border-radius:12px;
  font-weight:800;
}

main{
  max-width:1100px;
  margin:auto;
  padding:22px 15px 60px;
}

.hero{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 15% 20%,#ddd9ff 0,transparent 30%),
    radial-gradient(circle at 85% 80%,#d8f5ff 0,transparent 30%),
    white;
  border:1px solid var(--border);
  border-radius:25px;
  padding:55px 20px;
  text-align:center;
}

.hero-content{
  max-width:720px;
  margin:auto;
}

.badge{
  display:inline-block;
  background:#eeeeff;
  color:var(--accent);
  border:1px solid #ddd9ff;
  padding:7px 13px;
  border-radius:999px;
  font-size:13px;
  font-weight:800;
  margin-bottom:15px;
}

.hero h1{
  font-size:43px;
  line-height:1.2;
  margin-bottom:13px;
}

.hero p{
  color:var(--muted);
  font-size:16px;
  margin-bottom:25px;
}

.search{
  max-width:650px;
  margin:auto;
  display:flex;
  background:white;
  border:1px solid #dfe3ea;
  border-radius:15px;
  padding:5px;
  box-shadow:0 10px 30px rgba(20,25,35,.08);
}

.search input{
  flex:1;
  min-width:0;
  border:none;
  outline:none;
  padding:13px;
  font-size:14px;
  background:transparent;
}

.search button{
  border:none;
  background:var(--dark);
  color:white;
  padding:0 20px;
  border-radius:10px;
  font-weight:800;
}

.section{
  margin-top:28px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.section-header h2{
  font-size:22px;
}

.section-subtitle{
  color:var(--muted);
  font-size:13px;
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:5px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:white;
  color:var(--text);
  padding:10px 15px;
  border-radius:11px;
  font-weight:700;
  transition:.2s;
}

.category.active,
.category:hover{
  background:var(--dark);
  color:white;
  border-color:var(--dark);
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.product{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  transition:.2s;
}

.product:hover{
  transform:translateY(-4px);
  box-shadow:0 15px 35px rgba(20,25,35,.1);
}

.product-image{
  height:210px;
  position:relative;
  background:#f0f2f6;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.deal-badge{
  position:absolute;
  top:11px;
  right:11px;
  background:var(--dark);
  color:white;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:900;
}

.favorite{
  position:absolute;
  top:10px;
  left:10px;
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  font-size:21px;
}

.favorite.saved{
  color:var(--red);
}

.info{
  padding:14px;
}

.store{
  color:var(--muted);
  font-size:12px;
  margin-bottom:5px;
}

.name{
  font-weight:900;
  font-size:16px;
  margin-bottom:7px;
}

.rating{
  font-size:12px;
  margin-bottom:12px;
}

.rating span{
  color:var(--muted);
}

.price-area{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.price{
  font-size:20px;
  font-weight:900;
}

.old{
  color:#999fac;
  text-decoration:line-through;
  font-size:11px;
  margin-top:2px;
}

.discount{
  background:#e8f8ef;
  color:var(--green);
  padding:5px 7px;
  border-radius:7px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.buy-button{
  display:block;
  width:100%;
  border:none;
  background:var(--dark);
  color:white;
  padding:12px;
  border-radius:11px;
  font-weight:900;
  text-align:center;
  text-decoration:none;
  transition:.2s;
}

.buy-button:hover{
  opacity:.9;
  transform:translateY(-1px);
}

.commission{
  font-size:11px;
  color:var(--green);
  margin-top:9px;
  text-align:center;
  font-weight:700;
}

.no-results{
  display:none;
  text-align:center;
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:40px 20px;
}

.no-results-icon{
  font-size:40px;
  margin-bottom:10px;
}

.no-results p{
  color:var(--muted);
  margin:7px 0 18px;
}

.reset{
  border:none;
  background:var(--dark);
  color:white;
  padding:11px 17px;
  border-radius:10px;
  font-weight:800;
}

.info-box{

  border-radius:18px;
  padding:20px;
}

.info-box h2{
  font-size:19px;
  margin-bottom:8px;

.info-box p{
  color:var(--muted);
  font-size:13px;
  line-height:2;
}

footer{
  border-top:1px solid var(--border);
  background:white;
  text-align:center;
  padding:30px 15px;

.footer-title{
  font-size:20px;

footer p{

  font-size:13px;
  margin:5px 0 12px;

footer small{

  font-size:11px;

@media(max-width:900px){

  .hero p{

  }

    padding:0 14px;
  }

<script>

function searchProducts(){

  const input = document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const products =
    document.querySelectorAll(".product");

  let count = 0;

  products.forEach(product => {

    const name =
      product.dataset.name.toLowerCase();

    const category =
      product.dataset.category.toLowerCase();

    const show =
      name.includes(input) ||
      category.includes(input);

    product.style.display =
      show ? "" : "none";

    if(show) count++;

  });

  updateResults(count);
}


function filterCategory(category,button){

  const products =
    document.querySelectorAll(".product");

  document
    .querySelectorAll(".category")
    .forEach(item => {
      item.classList.remove("active");
    });

  button.classList.add("active");

  let count = 0;

  products.forEach(product => {

    const show =
      category === "all" ||
      product.dataset.category === category;

    product.style.display =
      show ? "" : "none";

    if(show) count++;

  });

  document
    .getElementById("searchInput")
    .value = "";

  updateResults(count);
}


function updateResults(count){

  document
    .getElementById("resultCount")
    .textContent =
    count + " محصول";

  document
    .getElementById("noResults")
    .style.display =
    count === 0 ? "block" : "none";

}


function resetSearch(){

  document
    .getElementById("searchInput")
    .value = "";

  const products =
    document.querySelectorAll(".product");

  products.forEach(product => {
    product.style.display = "";
  });

  document
    .querySelectorAll(".category")
    .forEach(item => {
      item.classList.remove("active");
    });

  document
    .querySelector(".category")
    .classList.add("active");

  updateResults(products.length);
}


function favorite(button){

  button.classList.toggle("saved");

  button.textContent =
    button.classList.contains("saved")
    ? "♥"
    : "♡";

}


function goAffiliate(productName,affiliateUrl){

  if(
    !affiliateUrl ||
    affiliateUrl === "https://example.com/"
  ){

    alert(
      "⚠️ لینک همکاری در فروش این محصول هنوز تنظیم نشده است.\n\n" +
      "ابتدا لینک افیلیت واقعی فروشگاه را جایگزین کنید."
    );

    return;
  }

  let clicks =
    JSON.parse(
      localStorage.getItem("affiliateClicks") || "[]"
    );

  clicks.push({
    product:productName,
    time:new Date().toISOString()
  });

  localStorage.setItem(
    "affiliateClicks",
    JSON.stringify(clicks)
  );

  window.location.href = affiliateUrl;

}


function showAffiliateInfo(){

  alert(
    "💰 سیستم همکاری در فروش\n\n" +
    "مشتری با لینک همکاری در فروش به فروشگاه اصلی می‌رود.\n\n" +
    "اگر خرید طبق شرایط برنامه افیلیت انجام شود، " +
    "کمیسیون برای صاحب لینک ثبت می‌شود.\n\n" +
    "توجه: ثبت کلیک در این صفحه به‌تنهایی به معنی ثبت کمیسیون واقعی نیست."
  );

}
