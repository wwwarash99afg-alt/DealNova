<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>جزئیات محصول | آنلاین‌شاپ</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .product-page {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px 70px;
    }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: var(--text);
      text-decoration: none;

      font-weight: 800;
      font-size: 14px;

      margin-bottom: 20px;
    }

    .product-detail {
      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 35px;

      background: white;

      border: 1px solid var(--border);

      border-radius: 25px;

      padding: 22px;

      box-shadow:
        0 15px 45px rgba(20, 25, 35, 0.06);
    }

    .product-photo {
      position: relative;

      height: 480px;

      overflow: hidden;

      border-radius: 20px;

      background: #f0f2f6;
    }

    .product-photo img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;
    }

    .detail-info {
      padding: 15px 5px;

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .detail-store {
      color: var(--muted);

      font-size: 13px;

      margin-bottom: 8px;
    }

    .detail-title {
      font-size: 32px;

      line-height: 1.4;

      font-weight: 900;

      margin-bottom: 10px;
    }

    .detail-rating {
      font-size: 14px;

      margin-bottom: 20px;
    }

    .detail-rating span {
      color: var(--muted);
    }

    .detail-price {
      font-size: 32px;

      font-weight: 900;

      margin-bottom: 4px;
    }

    .detail-old {
      color: #999fac;

      text-decoration: line-through;

      font-size: 14px;

      margin-bottom: 20px;
    }

    .detail-discount {
      display: inline-block;

      width: fit-content;

      background: #e8f8ef;

      color: var(--green);

      padding: 7px 11px;

      border-radius: 9px;

      font-size: 12px;

      font-weight: 900;

      margin-bottom: 22px;
    }

    .description {
      color: var(--muted);

      font-size: 14px;

      line-height: 2;

      margin-bottom: 25px;
    }

    .add-product {
      width: 100%;

      border: none;

      background: var(--dark);

      color: white;

      padding: 15px;

      border-radius: 13px;

      font-size: 15px;

      font-weight: 900;

      cursor: pointer;

      transition: 0.2s;
    }

    .add-product:hover {
      transform: translateY(-2px);

      opacity: 0.92;
    }

    .features {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-top: 15px;
    }

    .feature {
      background: #f7f8fa;

      border-radius: 12px;

      padding: 12px 8px;

      text-align: center;

      font-size: 11px;

      font-weight: 700;
    }

    @media (max-width: 750px) {

      .product-page {
        padding: 18px 12px 50px;
      }

      .product-detail {
        grid-template-columns: 1fr;

        gap: 15px;

        padding: 12px;

        border-radius: 20px;
      }

      .product-photo {
        height: 330px;

        border-radius: 16px;
      }

      .detail-info {
        padding: 8px 4px;
      }

      .detail-title {
        font-size: 25px;
      }

      .detail-price {
        font-size: 27px;
      }

      .description {
        font-size: 13px;
      }

    }

  </style>

</head>

<body>


<header>

  <div class="header">

    <a
      href="index.html"
      class="logo"
    >
      🛍️ <span>آنلاین</span>‌شاپ
    </a>

    <div class="header-actions">

      <a
        href="index.html"
        class="account"
        style="text-decoration:none;"
      >
        🏠 فروشگاه
      </a>

    </div>

  </div>

</header>


<main class="product-page">

  <a
    href="index.html"
    class="back"
  >
    → بازگشت به فروشگاه
  </a>


  <section class="product-detail">


    <div class="product-photo">

      <img
        src="https://images.unsplash.com/photo-1598327105666-5b89351aff97?auto=format&fit=crop&w=1000&q=90"
        alt="گوشی هوشمند شیائومی"
      >

    </div>


    <div class="detail-info">

      <div class="detail-store">
        فروشگاه آنلاین‌شاپ
      </div>

      <h1 class="detail-title">
        گوشی هوشمند شیائومی
      </h1>

      <div class="detail-rating">
        ⭐⭐⭐⭐⭐
        <span>
          4.8 از 5 — ۱۲۵ نظر
        </span>
      </div>

      <div class="detail-price">
        ۲۳۹ €
      </div>

      <div class="detail-old">
        ۲۹۹ €
      </div>

      <div class="detail-discount">
        🔥 ۲۰٪ تخفیف
      </div>

      <p class="description">
        یک گوشی هوشمند مدرن با طراحی زیبا،
        عملکرد سریع و صفحه‌نمایش باکیفیت.
        مناسب استفاده روزمره، کار، سرگرمی
        و عکاسی.
      </p>


      <button
        class="add-product"
        onclick="addProduct()"
      >
        🛒 افزودن به سبد خرید
      </button>


      <div class="features">

        <div class="feature">
          🚚 ارسال سریع
        </div>

        <div class="feature">
          🔒 خرید امن
        </div>

        <div class="feature">
          ↩️ ضمانت بازگشت
        </div>

      </div>

    </div>

  </section>

</main>


<script>

function addProduct() {

  alert(
    "✅ محصول به سبد خرید اضافه شد.\n\n" +
    "سیستم اتصال این صفحه به سبد خرید اصلی در مرحله بعد کامل می‌شود."
  );

}

</script>

</body>

  </html>
