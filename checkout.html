<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ثبت سفارش | آنلاین‌شاپ</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#f5f7fb;
color:#151923;
line-height:1.7;
}

header{
background:white;
border-bottom:1px solid #e5e8ef;
padding:16px 20px;
}

.header{
max-width:1000px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#151923;
text-decoration:none;
font-size:24px;
font-weight:900;
}

.back{
text-decoration:none;
color:#151923;
font-weight:700;
font-size:14px;
}

main{
max-width:1000px;
margin:auto;
padding:25px 15px 60px;
}

h1{
font-size:28px;
margin-bottom:20px;
}

.checkout-grid{
display:grid;
grid-template-columns:1.3fr .7fr;
gap:20px;
}

.box{
background:white;
border:1px solid #e5e8ef;
border-radius:18px;
padding:20px;
margin-bottom:20px;
}

.box h2{
font-size:19px;
margin-bottom:18px;
}

label{
display:block;
font-weight:700;
font-size:13px;
margin-bottom:6px;
}

input,
textarea{
width:100%;
border:1px solid #dfe3ea;
border-radius:11px;
padding:13px;
font-family:inherit;
font-size:14px;
outline:none;
margin-bottom:15px;
background:white;
}

textarea{
resize:vertical;
min-height:90px;
}

.order-item{
display:flex;
align-items:center;
gap:12px;
border-bottom:1px solid #eee;
padding:12px 0;
}

.order-item:last-child{
border-bottom:none;
}

.order-item img{
width:65px;
height:65px;
object-fit:cover;
border-radius:10px;
background:#f1f2f5;
}

.order-info{
flex:1;
}

.order-name{
font-weight:800;
font-size:14px;
}

.order-quantity{
color:#727989;
font-size:12px;
}

.order-price{
font-weight:900;
white-space:nowrap;
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:12px;
font-size:14px;
}

.summary-total{
border-top:1px solid #e5e8ef;
padding-top:15px;
margin-top:15px;
font-size:20px;
font-weight:900;
}

.payment-method{
border:1px solid #e5e8ef;
border-radius:12px;
padding:14px;
margin-bottom:10px;
cursor:pointer;
}

.payment-method input{
width:auto;
margin:0 8px 0 0;
}

.pay-button{
width:100%;
border:none;
background:#151923;
color:white;
padding:15px;
border-radius:12px;
font-size:15px;
font-weight:900;
cursor:pointer;
margin-top:10px;
}

.empty{
text-align:center;
padding:40px 15px;
background:white;
border-radius:18px;
border:1px solid #e5e8ef;
}

.empty-icon{
font-size:45px;
margin-bottom:10px;
}

.success{
display:none;
background:white;
border:1px solid #d9f0e2;
border-radius:20px;
padding:35px 20px;
text-align:center;
}

.success-icon{
font-size:55px;
margin-bottom:10px;
}

.order-number{
display:inline-block;
background:#f1f2f6;
padding:10px 18px;
border-radius:10px;
margin:15px 0;
font-weight:900;
}

.home-button{
display:inline-block;
text-decoration:none;
background:#151923;
color:white;
padding:12px 20px;
border-radius:11px;
font-weight:800;
}

@media(max-width:750px){

.checkout-grid{
grid-template-columns:1fr;
}

h1{
font-size:23px;
}

}

</style>

</head>

<body>

<header>

<div class="header">

<a href="index.html" class="logo">
🛍️ آنلاین‌شاپ
</a>

<a href="index.html" class="back">
← فروشگاه
</a>

</div>

</header>

<main>

<h1>
🧾 ثبت سفارش
</h1>

<div id="checkoutContent">

<div class="checkout-grid">

<div>

<div class="box">

<h2>
👤 اطلاعات مشتری
</h2>

<label>
نام و نام خانوادگی
</label>

<input
id="customerName"
type="text"
placeholder="نام خود را وارد کنید"
>

<label>
شماره تلفن
</label>

<input
id="phone"
type="tel"
placeholder="شماره تلفن"
>

<label>
ایمیل
</label>

<input
id="email"
type="email"
placeholder="ایمیل"
>

<label>
آدرس
</label>

<textarea
id="address"
placeholder="آدرس کامل خود را وارد کنید"
></textarea>

</div>

<div class="box">

<h2>
💳 روش پرداخت
</h2>

<label class="payment-method">

<input
type="radio"
name="payment"
value="online"
checked
>

پرداخت آنلاین

</label>

<label class="payment-method">

<input
type="radio"
name="payment"
value="card"
>

کارت بانکی

</label>

<label class="payment-method">

<input
type="radio"
name="payment"
value="cod"
>

پرداخت هنگام تحویل

</label>

<button
class="pay-button"
onclick="submitOrder()"
>

🔒 ثبت سفارش

</button>

</div>

</div>

<div>

<div class="box">

<h2>
🛒 خلاصه سفارش
</h2>

<div id="orderItems"></div>

<div class="summary-row">

<span>
تعداد کالا:
</span>

<strong id="itemCount">
۰
</strong>

</div>

<div class="summary-row">

<span>
هزینه ارسال:
</span>

<strong>
رایگان
</strong>

</div>

<div class="summary-row summary-total">

<span>
مجموع:
</span>

<strong id="totalPrice">
€0
</strong>

</div>

</div>

</div>

</div>

</div>

<div id="success" class="success">

<div class="success-icon">
✅
</div>

<h2>
سفارش شما ثبت شد
</h2>

<p>
سفارش شما با موفقیت ثبت شد.
</p>

<div class="order-number">

شماره سفارش:

<span id="orderNumber"></span>

</div>

<p style="color:#727989;margin-bottom:20px;">
پرداخت واقعی هنوز به سایت متصل نشده است.
</p>

<a href="index.html" class="home-button">
🏠 بازگشت به فروشگاه
</a>

</div>

</main>

<script>

let cart=JSON.parse(
localStorage.getItem("onlineShopCart")||"[]"
);

function showOrder(){

const orderItems=
document.getElementById("orderItems");

const totalPrice=
document.getElementById("totalPrice");

const itemCount=
document.getElementById("itemCount");

if(cart.length===0){

document.getElementById("checkoutContent").innerHTML=`

<div class="empty">

<div class="empty-icon">
🛒
</div>

<h2>
سبد خرید خالی است
</h2>

<p style="color:#727989;margin:10px 0 20px;">
ابتدا یک محصول به سبد خرید اضافه کنید.
</p>

<a href="index.html" class="home-button">
🛍️ رفتن به فروشگاه
</a>

</div>

`;

return;

}

let total=0;
let count=0;

orderItems.innerHTML="";

cart.forEach(item=>{

total+=item.price*item.quantity;
count+=item.quantity;

orderItems.innerHTML+=`

<div class="order-item">

<img
src="${item.image}"
alt="${item.name}"
>

<div class="order-info">

<div class="order-name">
${item.name}
</div>

<div class="order-quantity">
تعداد: ${item.quantity}
</div>

</div>

<div class="order-price">
€${item.price*item.quantity}
</div>

</div>

`;

});

totalPrice.textContent="€"+total;
itemCount.textContent=count;

}

function submitOrder(){

const name=
document.getElementById("customerName").value.trim();

const phone=
document.getElementById("phone").value.trim();

const address=
document.getElementById("address").value.trim();

if(!name){

alert("لطفاً نام و نام خانوادگی را وارد کنید.");

return;

}

if(!phone){

alert("لطفاً شماره تلفن را وارد کنید.");

return;

}

if(!address){

alert("لطفاً آدرس را وارد کنید.");

return;

}

if(cart.length===0){

alert("سبد خرید شما خالی است.");

return;

}

const orderNumber=
"ON-"+Date.now().toString().slice(-8);

document.getElementById("orderNumber").textContent=
orderNumber;

document.getElementById("checkoutContent").style.display=
"none";

document.getElementById("success").style.display=
"block";

localStorage.setItem(
"lastOrderNumber",
orderNumber
);

localStorage.setItem(
"lastOrderCustomer",
JSON.stringify({
name:name,
phone:phone,
email:document.getElementById("email").value.trim(),
address:address
})
);

localStorage.removeItem("onlineShopCart");

}

showOrder();

</script>

</body>

  </html>
